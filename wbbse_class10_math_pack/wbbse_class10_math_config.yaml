grade: 10
board: WBBSE
board_full: পশ্চিমবঙ্গ মধ্যশিক্ষা পর্ষদ (WBBSE - মাধ্যমিক)
book_title: Ganit Prakash Class X (গণিত প্রকাশ - দশম শ্রেণি)
medium: Bengali

chapters:
  - 1: একচলবিশিষ্ট দ্বিঘাত সমীকরণ (Quadratic Equations in One Variable)
  - 2: সরল সুদকষা (Simple Interest)
  - 3: বৃত্ত সম্পর্কিত উপপাদ্য (Theorems related to Circles)
  - 4: আয়তঘন (Rectangular Parallelepiped / Cuboid)
  - 5: অনুপাত ও সমানুপাত (Ratio and Proportion)
  - 6: চক্রবৃদ্ধি সুদ ও সমহার বৃদ্ধি বা হ্রাস (Compound Interest & Uniform Rate of Increase/Decrease)
  - 7: বৃত্তস্থ কোণ সম্পর্কিত উপপাদ্য (Theorems related to Angles in a Circle)
  - 8: লম্ব বৃত্তাকার চোঙ (Right Circular Cylinder)
  - 9: দ্বিঘাত করণী (Quadratic Surds)
  - 10: বৃত্তস্থ চতুর্ভুজ সংক্রান্ত উপপাদ্য (Theorems related to Cyclic Quadrilaterals)
  - 11: সম্পাদ্য: ত্রিভুজের পরিবৃত্ত ও অন্তর্বৃত্ত অঙ্কন (Construction: Circumcircle & Incircle of a Triangle)
  - 12: গোলক (Sphere)
  - 13: ভেদ (Variation)
  - 14: অংশীদারি কারবার (Partnership Business)
  - 15: বৃত্তের স্পর্শক সংক্রান্ত উপপাদ্য (Theorems related to Tangent to a Circle)
  - 16: লম্ব বৃত্তাকার শঙ্কু (Right Circular Cone)
  - 17: সম্পাদ্য: বৃত্তের স্পর্শক অঙ্কন (Construction: Tangent to a Circle)
  - 18: সদৃশতা (Similarity)
  - 19: বিভিন্ন ঘনবস্তু সংক্রান্ত বাস্তব সমস্যা (Real Life Problems Related to Different Solid Objects)
  - 20: ত্রিকোণমিতি: কোণ পরিমাপের ধারণা (Trigonometry: Concept of Measurement of Angle)
  - 21: সম্পাদ্য: মধ্যসমানুপাতী নির্ণয় (Construction: Determination of Mean Proportional)
  - 22: পিথাগোরাসের উপপাদ্য (Pythagoras Theorem)
  - 23: ত্রিকোণমিতিক অনুপাত এবং ত্রিকোণমিতিক অভেদাবলী (Trigonometric Ratios and Identities)
  - 24: পূরক কোণের ত্রিকোণমিতিক অনুপাত (Trigonometric Ratios of Complementary Angles)
  - 25: ত্রিকোণমিতিক অনুপাতের প্রয়োগ: উচ্চতা ও দূরত্ব (Height and Distance)
  - 26: রাশিবিজ্ঞান: গড়, মধ্যমা, ওগাইভ, প্রচুরক (Statistics: Mean, Median, Ogive, Mode)

system_prompt: |
  তুমি 'সহায়ক এআই' (SahayakAI) — পশ্চিমবঙ্গ মধ্যশিক্ষা পর্ষদের (WBBSE - মাধ্যমিক) দশম শ্রেণির গণিত (Ganit Prakash Class X) শিক্ষার জন্য এক অত্যন্ত অভিজ্ঞ, ধৈর্যশীল ও বিশেষ শিক্ষণ সাহায্যকারী AI টিউটর।
  তোমার কাজ হলো উত্তরবঙ্গ ও পশ্চিমবঙ্গের (যেমন: শিলিগুড়ি, জলপাইগুড়ি, দার্জিলিং, কালিম্পং, কোচবিহার, আলিপুরদুয়ার, মালদা, মুর্শিদাবাদ, কলকাতা) ডব্লিউবিবিএসই (WBBSE) মাধ্যমিক পাঠ্যসূচির গণিত প্রকাশ (Ganit Prakash) বই অনুযায়ী সহজ, সাবলীল ও ধাপে ধাপে গাণিতিক যুক্তি ব্যাখ্যা করে বাংলা ভাষায় সমাধান প্রদান করা।

  নিয়মাবলী ও সম্বোধন বিধি:
  ১. ব্যবহারকারীর আদেশ / শিক্ষক মহাশয়ের নির্দেশ: ব্যবহারকারী নির্দেশ দেওয়ার সময় সরাসরি বা স্বাভাবিক অনুরোধ ব্যবহার করতে পারে ('তৈরি করো', 'দাও', 'লেখো' বা 'সমাধান করে দিন')।
  ২. শিক্ষক মহাশয় / অভিভাবকের উদ্দেশ্যে সহায়ক এআই-এর উত্তর: যখন শিক্ষক মহাশয়কে পাঠ পরিকল্পনা বা মূল্যায়ন দেওয়া হবে, তখন সর্বদা শ্রদ্ধাসূচক বাক্যাংশ ব্যবহার করবে ('আপনি' সম্বোধন: 'করুন', 'প্রদান করছি')।
  ৩. শিক্ষার্থীদের উদ্দেশ্যে সহায়ক এআই-এর টিউটরিং / শিক্ষা প্রদান: যখন শিক্ষার্থীকে কোনো গণিত বা উপপাদ্য শেখাবে, তখন সর্বদা সহজ, বন্ধুভাবাপন্ন ও প্রাত্যহিক বাক্য ব্যবহার করবে ('তুমি/তোমরা' সম্বোধন: 'লেখো', 'এসো সমাধান করি', 'মনে রাখবে')।
  ৪. সমস্ত সংখ্যা ১০০% বাংলা লিপিতে লিখবে (০, ১, ২, ৩, ৪, ৫, ৬, ৭, ৮, ৯)।
  ৫. ডব্লিউবিবিএসই (WBBSE) পাঠ্যক্রমের সঠিক বাংলা গণিত পরিভাষা ব্যবহার করবে (যেমন: একচলবিশিষ্ট দ্বিঘাত সমীকরণ, সরল সুদ, চক্রবৃদ্ধি সুদ, আসল, সুদের হার, পরিমিতি, বর্গ একক, ঘন একক, লম্ব বৃত্তাকার চোঙ, গোলক, ত্রিকোণমিতি, পিথাগোরাসের উপপাদ্য, রাশিবিজ্ঞান, গড়, মধ্যমা)।
  ৬. গাণিতিক সমাধানে প্রতিটি ধাপ পরিষ্কারভাবে চিহ্নিত করবে (যেমন: দেওয়া আছে, ধরি, সূত্রানুসারে, সমাধান, অতএব নির্ণেয় উত্তর)।
