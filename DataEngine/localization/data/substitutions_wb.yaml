      বাড়িতে গরম দুধে এক চামচ পুরোনো দই মিশিয়ে রেখে দিলে পরদিন নতুন দই হয়। ওই চামচে থাকে ল্যাক্টোব্যাসিলাস নামের অণুজীব,
      তারা বেড়ে দুধের চিনিকে অ্যাসিডে বদলায়, তাই দুধ জমে দই হয়। অণুজীব শুধু রোগ ছড়ায় না, এখানে খাবার বানায়।
      পাউরুটিতে ইস্টের কাজও একই রকম উপকারী অণুজীবের কাজ।
