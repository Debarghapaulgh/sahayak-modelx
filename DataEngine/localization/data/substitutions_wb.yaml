  # ---- cooling by evaporation (matka trap handled) ----
  - id: s_evapcool_matka
    concept_id: c_evapcool
    strategy: anchor_substitution
    zone_id: rarh_plateau
    local_anchor: {entity_id: matka}
    keep_canonical: true
    disanalogy_flags:
      - "কলসির ঠান্ডা পরিবহন (conduction) নয়। মাটির ছিদ্র দিয়ে জল বাইরে এসে বাষ্প হয়, বাষ্পীভবনে তাপ নেয় বলে জল ঠান্ডা হয়।"
    text_bn: >-
      গরমে মাটির কলসির জল ফ্রিজ ছাড়াই ঠান্ডা থাকে। কলসির গায়ে ছোট ছোট ছিদ্র আছে, সেখান দিয়ে একটু জল বাইরে এসে বাষ্প হয়ে
      যায়। বাষ্প হতে জলের তাপ লাগে, সেই তাপ ভেতরের জল থেকেই নেয়, তাই ভেতরের জল ঠান্ডা হয়। একেই বাষ্পীভবনজনিত শীতলতা বলে;
      ঘাম শুকিয়ে ঠান্ডা লাগাও একই কারণে।
    validation: *val
    status: approved
  - id: s_evapcool_talpata
    concept_id: c_evapcool
    strategy: sensory
    zone_id: gangetic_plain
    local_anchor: {entity_id: talpata_fan}
    keep_canonical: true
    disanalogy_flags:
      - "পাখা বাতাস ঠান্ডা করে না; বাতাস ঘামের বাষ্পীভবন বাড়ায়, তাতেই ঠান্ডা লাগে।"
    text_bn: >-
      লোডশেডিংয়ে তালপাতার পাখা নাড়লে আরাম লাগে, অথচ পাখার হাওয়া তো গরমই। আসলে হাওয়া গায়ের ঘাম তাড়াতাড়ি বাষ্প করে দেয়,
      আর বাষ্প হতে ঘাম শরীর থেকে তাপ নেয়, তাই ঠান্ডা লাগে। এটাই বাষ্পীভবনজনিত শীতলতা।
    validation: *val
    status: approved

