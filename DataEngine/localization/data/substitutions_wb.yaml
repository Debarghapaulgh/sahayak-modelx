_val: &val {pedagogy: pass, authenticity: teacher_informal, factual: pass, attested_by: AG, date: 2026-09-19}

substitutions:
  # ---- gravity ----
  - id: s_gravity_mango
    concept_id: c_gravity
    strategy: anchor_substitution
    zone_id: north_bengal_tea_belt
    local_anchor: {entity_id: mango}
    keep_canonical: true
    disanalogy_flags: []
    text_bn: >-
      গরমে আমগাছ ঝাঁকালে সব আম সোজা নিচে পড়ে, একটাও ওপরে ওড়ে না। পৃথিবী আমের ভরকে নিজের কেন্দ্রের দিকে টানে,
      এই টানই অভিকর্ষ বল (মহাকর্ষ)। ভারী ও হালকা আম একই ডাল থেকে পড়লে একই সময়ে মাটিতে পৌঁছয়।
      নিউটনের আপেলও ঠিক এভাবেই পড়েছিল, আম আমাদের নিজের আপেল।
    validation: *val
    status: approved
  - id: s_gravity_coconut
    concept_id: c_gravity
    strategy: anchor_substitution
    zone_id: sundarbans_delta
    local_anchor: {entity_id: coconut}
    keep_canonical: true
    disanalogy_flags: []
    text_bn: >-
      পুকুরপাড়ের নারকেল গাছ থেকে ডাব খসে পড়লে সোজা নিচে পড়ে, পাশে বা ওপরে যায় না। পৃথিবী নারকেলের ভরকে নিচের দিকে
      টানে, এই টানই অভিকর্ষ বল। উঁচু গাছ থেকে পড়ে বলে বেগ বেশি হয়, তাই নিচে দাঁড়ানো বিপজ্জনক।
    validation: *val
    status: approved
  - id: s_gravity_jackfruit
    concept_id: c_gravity
    strategy: anchor_substitution
    zone_id: rarh_plateau
    local_anchor: {entity_id: jackfruit}
    keep_canonical: true
    disanalogy_flags: []
    text_bn: >-
      পাকা কাঁঠাল ডাল থেকে খসে পড়লে ধপ করে আওয়াজ হয়, কারণ পৃথিবী ভারী কাঁঠালকে জোরে টানে। এই টানই অভিকর্ষ বল।
      মনে রাখবে, ভারী বলে বেশি জোরে টান লাগে, কিন্তু একই উচ্চতা থেকে হালকা ফলও একই সময়েই মাটিতে পড়ে।
    validation: *val
    status: approved

  # ---- photosynthesis ----
  - id: s_photo_khichdi
    concept_id: c_photo
    strategy: analogy
    zone_id: gangetic_plain
    local_anchor: {entity_id: khichdi}
    mapping: {inputs: "চাল-ডাল-জল ↔ কার্বন ডাই-অক্সাইড ও জল", energy: "উনুনের আঁচ ↔ সূর্যালোক", output: "খিচুড়ি ↔ গ্লুকোজ (খাদ্য)", site: "হাঁড়ি ↔ পাতার ক্লোরোপ্লাস্ট"}
    keep_canonical: true
    disanalogy_flags:
      - "শক্তির উৎস আলাদা: খিচুড়ি রান্না হয় তাপে, সালোকসংশ্লেষ হয় আলোতে। শিক্ষক জোরে বলবেন, নইলে ছাত্র ভাববে গাছের গরম লাগে।"
      - "রান্নায় গ্যাস বেরোয় না; সালোকসংশ্লেষে অক্সিজেন বেরোয়।"
    text_bn: >-
      পাতাকে ভাবো একটা ছোট রান্নাঘর, যেখানে খিচুড়ি রান্না হচ্ছে। কাঁচা উপকরণ ঢোকে (বাতাসের কার্বন ডাই-অক্সাইড আর শিকড়ের জল),
      শক্তি দিয়ে সেগুলো খাদ্যে (গ্লুকোজ) বদলে যায়। হাঁড়িটা হলো পাতার ক্লোরোপ্লাস্ট। একটা পার্থক্য মনে রাখো: উনুন রান্না করে তাপে,
      কিন্তু পাতা রান্না করে সূর্যের আলোতে, তাই গাছের রোদ লাগে, উনুন নয়। আর রান্নাঘরের মতো নয়, পাতা অক্সিজেনও ছাড়ে।
      পরীক্ষায় শব্দটা সালোকসংশ্লেষই থাকবে।
    validation: *val
    status: approved
  - id: s_photo_tea
    concept_id: c_photo
    strategy: applied_context
    zone_id: north_bengal_tea_belt
    local_anchor: {entity_id: tea}
    keep_canonical: true
    disanalogy_flags: []
    text_bn: >-
      চা-বাগানের প্রতিটি সবুজ পাতা রোদে দাঁড়িয়ে নিজের খাদ্য বানায়, এটাই সালোকসংশ্লেষ। তাই চা গাছ ছায়ায় ভালো বাড়ে না,
      আর পাতা তোলার পর নতুন কুঁড়ি গজাতে সময় লাগে, কারণ গাছ আবার খাদ্য তৈরির পাতা বানাচ্ছে। সালোকসংশ্লেষে গাছ বাতাসের
      কার্বন ডাই-অক্সাইড ও জল থেকে আলোর শক্তিতে গ্লুকোজ বানায় এবং অক্সিজেন ছাড়ে।
    validation: *val
    status: approved

  # ---- acids, bases, indicators ----
  - id: s_acid_haldi
    concept_id: c_acidbase
    strategy: anchor_substitution
    zone_id: gangetic_plain
    local_anchor: {entity_id: haldi_turmeric}
    keep_canonical: true
    disanalogy_flags: []
    text_bn: >-
      অ্যাসিড-ক্ষার চিনতে দোকানের লিটমাস লাগে না, রান্নাঘরের হলুদই যথেষ্ট। জামায় হলুদের দাগে লেবুর রস (অ্যাসিড) লাগালে
      হলুদই থাকে, কিন্তু সাবান বা চুনজল (ক্ষার) লাগলে দাগ লাল হয়ে যায়। রং বদলে যে জিনিস অ্যাসিড না ক্ষার তা জানায়,
      তাকেই নির্দেশক বলে; হলুদ একটি প্রাকৃতিক নির্দেশক। পরীক্ষার জন্য লিটমাসই মূল নির্দেশক, হলুদ বাড়িতে সেই ধারণাটাই দেখায়।
    validation: *val
    status: approved

  # ---- useful microorganisms ----
  - id: s_microbe_dahi
    concept_id: c_microbe
    strategy: applied_context
    zone_id: north_bengal_tea_belt
    local_anchor: {entity_id: dahi_curd}
    keep_canonical: true
    disanalogy_flags: []
