rejected_examples:
  - id: s_conduction_matka_REJECTED
    concept_id: null   # would have been a conduction/heat concept
    strategy: anchor_substitution
    zone_id: rajasthan_arid
    local_anchor: {entity_id: matka}
    reason_rejected: >
      A matka keeping water cool is EVAPORATIVE cooling (water seeps through porous clay
      and evaporates), NOT conduction. Using it to teach conduction bakes in a misconception.
      Correct use: teach evaporation/cooling, and explicitly contrast with conduction.
    lesson: "affordance NOT_conduction_cooling=true must block the conduction match automatically."
